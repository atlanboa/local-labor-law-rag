[project]
name = "lawbot"
version = "0.1.0"
description = "근로기준법 중심 로컬 RAG 상담봇"
readme = "README.md"
license = "MIT"
authors = [
    { name = "atlanboa" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
index = "lawbot.index:main"
ask = "lawbot.cli:main"
eval = "lawbot.evaluate:main"
serve = "lawbot.server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
